name: Verify event consumers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      BUNDLE_FROZEN: "true"
      BUNDLE_WITH: postgres
      SHOPIFY_LEDGER_POSTGRES_URL: postgres://postgres:ledger@127.0.0.1:5432/ledger
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Test and demo from scratch
        shell: bash
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          unset BUNDLE_GEMFILE RUBYOPT
          "$GITHUB_WORKSPACE/bin/setup"
          "$GITHUB_WORKSPACE/bin/check"
          "$GITHUB_WORKSPACE/bin/shopify-check"
          "$GITHUB_WORKSPACE/bin/demo"
          "$GITHUB_WORKSPACE/bin/inventory-demo"
          "$GITHUB_WORKSPACE/bin/shopify-demo"
          "$GITHUB_WORKSPACE/bin/shopify-ops-demo"
          "$GITHUB_WORKSPACE/bin/shopify-demo" --evidence > /dev/null
          "$GITHUB_WORKSPACE/test/whiteboard"
