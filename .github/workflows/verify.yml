name: Verify event consumers

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      BUNDLE_FROZEN: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "2.6.10"
          bundler: "1.17.2"
      - name: Install locked gems
        run: bundle install --deployment
      - name: Test and demo from scratch
        shell: bash
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          env -u BUNDLE_GEMFILE -u RUBYOPT "$GITHUB_WORKSPACE/bin/check"
          env -u BUNDLE_GEMFILE -u RUBYOPT "$GITHUB_WORKSPACE/bin/shopify-check"
          env -u BUNDLE_GEMFILE -u RUBYOPT "$GITHUB_WORKSPACE/bin/shopify-demo"
